services:
  postgres:
    image: postgres:17-alpine
    container_name: fiszki-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fiszki
      POSTGRES_PASSWORD: fiszki
      POSTGRES_DB: fiszki
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiszki -d fiszki"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
