# Cloudflare Tunnel configuration for Windows Laptop (C:\Users\<You>\.cloudflared\config.yml)
# If you manage the tunnel via Cloudflare Zero Trust Dashboard (token-based), configure these two Public Hostnames there instead:
#   1. api.yourdomain.com         -> http://localhost:8080
#   2. staging-api.yourdomain.com -> http://localhost:8081

tunnel: <YOUR-TUNNEL-UUID>
credentials-file: C:\Users\<YOUR-WINDOWS-USER>\.cloudflared\<YOUR-TUNNEL-UUID>.json

ingress:
  # Production (main branch -> port 8080)
  - hostname: api.yourdomain.com
    service: http://localhost:8080

  # Staging (dev branch -> port 8081)
  - hostname: staging-api.yourdomain.com
    service: http://localhost:8081

  - service: http_status:404
